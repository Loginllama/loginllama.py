[project]
name = "loginllama"
version = "3.1.0"
description = "Python SDK for LoginLlama suspicious login detection"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Josh Ghent", email = "me@joshghent.com" }]
license = { text = "MIT" }
dependencies = [
  "requests>=2.33.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=6.0.0",
  "requests-mock>=1.12.1",
  "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q --cov=loginllama --cov-report=term-missing"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.coverage.run]
source = ["loginllama"]

[tool.coverage.report]
fail_under = 75
show_missing = true
